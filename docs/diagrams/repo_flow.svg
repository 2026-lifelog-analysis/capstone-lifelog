<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="repo_flow-title repo_flow-desc"><title id="repo_flow-title">자료가 경보가 되기까지 일곱 단계</title><desc id="repo_flow-desc">NetHealth 원본 자료가 전처리로 사람·하루 단위 표가 되고, 지표에 방법을 적용해 하루 점수가 나오고, 평가에서 가짜 변화를 심어 채점하고 노트북·테스트로 확인하는 일곱 단계와 각 단계의 코드 위치를 보여 준다.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="36" y="64" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">자료가 경보가 되기까지 일곱 단계</text>
<line x1="188" y1="210" x2="211" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
